<svg viewBox="0 0 600 230" role="img" aria-label="Three steps: take two gummies, take them 30 minutes before a meal, sip a full glass of water" xmlns="http://www.w3.org/2000/svg"><g class="gn-layer" style="--d:0ms"><rect x="10" y="105" width="184" height="120" rx="16" fill="#bd8160"></rect><text x="102" y="157" text-anchor="middle" fill="#fff" font-size="38" font-weight="800">1</text><text x="102" y="187" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">Take</text><text x="102" y="209" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">2 gummies</text></g><g class="gn-layer" style="--d:160ms"><rect x="208" y="69" width="184" height="156" rx="16" fill="#a4572f"></rect><text x="300" y="121" text-anchor="middle" fill="#fff" font-size="38" font-weight="800">2</text><text x="300" y="151" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">Time it</text><text x="300" y="173" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">30 min pre-meal</text></g><g class="gn-layer" style="--d:320ms"><rect x="406" y="33" width="184" height="192" rx="16" fill="#0d6682"></rect><text x="498" y="85" text-anchor="middle" fill="#fff" font-size="38" font-weight="800">3</text><text x="498" y="115" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">Sip</text><text x="498" y="137" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">a full glass</text></g></svg>